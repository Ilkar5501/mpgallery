 const label=document.createElement('button');label.className='tier-label';label.type='button';label.style.setProperty('--tier-color',colors[i]);label.setAttribute('aria-label','Move selected icon to '+tier+' tier');
 const name=document.createElement('strong');name.textContent=tier;
 const count=document.createElement('small');count.id='count-'+tier;
 label.append(name,count);label.onclick=()=>{if(selected)move(selected,tier);};
 const zone=document.createElement('div');zone.className='zone';zone.dataset.zone=tier;zone.id='tier-'+tier;zone.setAttribute('role','group');zone.setAttribute('aria-label',tier+' tier');
 row.append(label,zone);$('board').append(row);
}
function announce(message){$('status').textContent=message;}
function move(id,destination,before=null){
 if(!byId.has(id)||!Object.hasOwn(placements,destination)||before===id)return;
 const source=Object.keys(placements).find(t=>placements[t].includes(id));
 placements[source].splice(placements[source].indexOf(id),1);
 const index=before?placements[destination].indexOf(before):-1;
 if(index<0)placements[destination].push(id);else placements[destination].splice(index,0,id);
 selected=null;dragged=null;render();
 announce(byId.get(id).name+' moved to '+(destination==='pool'?'Unranked':destination)+'.');
}
function render(){
 const query=$('search').value.trim().toLocaleLowerCase();
 for(const tier of [...tierNames,'pool']){
  const zone=tier==='pool'?$('pool'):$('tier-'+tier);zone.replaceChildren();zone.classList.remove('over');
  for(const id of placements[tier]){
   const c=byId.get(id);
   if(tier==='pool'&&query&&!`${c.name} ${c.title} ${c.school}`.toLocaleLowerCase().includes(query))continue;
   const unit=document.createElement('button');unit.type='button';unit.className='unit';unit.draggable=true;unit.dataset.id=id;unit.setAttribute('aria-label',c.name+' — '+c.title);unit.title=c.name+' — '+c.title+' · '+c.rarity+'★';unit.setAttribute('aria-pressed',String(selected===id));
   const img=document.createElement('img');img.src=c.icon;img.alt='';img.draggable=false;img.width=52;img.height=52;
   const name=document.createElement('span');name.className='unit-name';name.textContent=c.name;
   const title=document.createElement('span');title.className='unit-title';title.textContent=c.title;
   unit.append(img,name,title);
   unit.onclick=e=>{e.stopPropagation();selected=selected===id?null:id;render();announce(selected?c.name+' selected. Choose a tier.':'Selection cleared.');document.querySelector('.unit[data-id="'+CSS.escape(id)+'"]')?.focus({preventScroll:true});};
   unit.ondragstart=e=>{dragged=id;unit.classList.add('dragging');e.dataTransfer.setData('text/plain',id);e.dataTransfer.effectAllowed='move';};
   zone.append(unit);
  }
  if(tier!=='pool')$('count-'+tier).textContent=placements[tier].length;
 }
 $('pool-count').textContent=placements.pool.length+' icons';$('return').disabled=!selected;
}
for(const zone of document.querySelectorAll('[data-zone]')){
 zone.onclick=()=>{if(selected)move(selected,zone.dataset.zone);};
 zone.ondragover=e=>{if(dragged){e.preventDefault();e.dataTransfer.dropEffect='move';zone.classList.add('over');}};
 zone.ondragleave=e=>{if(!zone.contains(e.relatedTarget))zone.classList.remove('over');};
 zone.ondrop=e=>{
  e.preventDefault();const id=dragged;if(!byId.has(id))return;
  const target=e.target.closest('.unit');let before=target?.dataset.id||null;
  if(target&&e.clientX>target.getBoundingClientRect().left+target.offsetWidth/2)before=target.nextElementSibling?.dataset.id||null;
  move(id,zone.dataset.zone,before);
 };
}
document.addEventListener('dragend',()=>{dragged=null;document.querySelectorAll('.over,.dragging').forEach(e=>e.classList.remove('over','dragging'));});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){selected=null;render();announce('Selection cleared.');}});
$('return').onclick=()=>{if(selected)move(selected,'pool');};
$('search').oninput=render;
function reset(){for(const t of tierNames)placements[t]=[];placements.pool=roster.map(c=>c.id);selected=null;dragged=null;$('search').value='';render();announce('');}
$('reset').onclick=reset;
function syncTheme(){const dark=document.documentElement.dataset.theme==='dark';$('theme-toggle').setAttribute('aria-pressed',String(dark));}
$('theme-toggle').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;syncTheme();try{localStorage.setItem('hiq-theme',t);}catch{}};
syncTheme();reset();
</script>
</body>
</html>
